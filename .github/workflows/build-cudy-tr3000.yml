name: Build Openwrt Cudy TR3000

on:
  # 必须带 types: 裸 repository_dispatch 会被任意 event_type 命中,
  # 而 PonWrt 那条线也这么写 -> 一次 dispatch 会同时把两条线拉起来。
  repository_dispatch:
    types: [build-tr3000]
  workflow_dispatch:
    inputs:
      release:
        description: "是否创建 Release (yes/no)"
        required: false
        default: "no"
      force:
        description: "跳过上游更新检查, 强制编译 (yes/no)"
        required: false
        default: "no"

permissions: write-all

concurrency:
  # 单次构建约 3.5 小时。新 push 直接取消未完成的旧构建,
  # 避免几个大构建并行、最后只有一份产物有用。
  group: tr3000-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "25.12.6"
  TZ: Asia/Shanghai

jobs:
  check:
    name: build openwrt cudy tr3000
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install dependence
      env:
        DEBIAN_FRONTEND: noninteractive # 无交互安装
      run: |
        sudo -E apt update
        sudo -E apt install bc binutils-gold bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools unzip wget xsltproc xxd zlib1g-dev zstd
        
    - name: Clone openwrt source code
      run: |
        curl -L -O https://github.com/openwrt/openwrt/archive/refs/tags/v${{ env.OPENWRT_VERSION }}.tar.gz
        tar -zxvf v${{ env.OPENWRT_VERSION }}.tar.gz
        cd openwrt-${{ env.OPENWRT_VERSION }}
        
    - name: Copy files
      run: |
        cp .config feeds.conf.default openwrt-${{ env.OPENWRT_VERSION }}/
        cd openwrt-${{ env.OPENWRT_VERSION }}
        rm -rf feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}
      
    - name: Update the feeds
      run: |
        cd openwrt-${{ env.OPENWRT_VERSION }}
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Make Download
      env:
        FORCE_UNSAFE_CONFIGURE: 1
      run: |
        cd openwrt-${{ env.OPENWRT_VERSION }}
        make download
    
    - name: Make
      env:
        FORCE_UNSAFE_CONFIGURE: 1
      run: |
        cd openwrt-${{ env.OPENWRT_VERSION }}
        make -j8
    
    - name: zip the bin
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r openwrt-tr3000.zip openwrt-${{ env.OPENWRT_VERSION }}/bin


    - name: Create tag
      id: create_tag
      run: |
        tag_name="v${{ env.OPENWRT_VERSION }}"
        git tag $tag_name
        git push origin $tag_name

    - name: Release and Upload
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: openwrt-tr3000.zip
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
